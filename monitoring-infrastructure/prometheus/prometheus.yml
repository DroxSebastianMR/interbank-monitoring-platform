global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: monitoring-backend
    metrics_path: /metrics
    static_configs:
      - targets: [monitoring-backend:4000]
  - job_name: app-backend
    metrics_path: /metrics
    static_configs:
      - targets: [app-backend-1:3000, app-backend-2:3000]
