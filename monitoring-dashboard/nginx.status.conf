server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index status.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = / { expires -1; try_files /status.html =404; }
  location = /status { expires -1; try_files /status.html =404; }
  location = /status.html { expires -1; try_files $uri =404; }
  location ^~ /assets/ { try_files $uri =404; expires 1y; }
  location = /status-health { access_log off; default_type text/plain; return 200 'ok'; }
  location / { return 404; }
}
